spec:
  replicas: 2
  selector:
    matchLabels: {app: symptom-agent}
  template:
    metadata:
      labels: {app: symptom-agent}
    spec:
      containers:
        - name: agent
          image: YOUR_REGISTRY/medagent-ai:stable
          command: ["python", "-m", "backend.a2a_server", "--agent", "symptom", "--host", "0.0.0.0", "--port", "8011"]
          ports: [{containerPort: 8011}]
          envFrom:
            - configMapRef: {name: medagent-config}
            - secretRef: {name: medagent-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: symptom-agent
spec:
  selector: {app: symptom-agent}
  ports: [{port: 8011, targetPort: 8011}]

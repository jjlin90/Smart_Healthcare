apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medagent-mcp
spec:
  replicas: 2
  selector:
    matchLabels: {app: medagent-mcp}
  template:
    metadata:
      labels: {app: medagent-mcp}
    spec:
      containers:
        - name: mcp
          image: YOUR_REGISTRY/medagent-ai:stable
          command: ["python", "-m", "backend.mcp_tools"]
          ports: [{containerPort: 8002}]
          envFrom:
            - configMapRef: {name: medagent-config}
            - secretRef: {name: medagent-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: medagent-mcp
spec:
  selector: {app: medagent-mcp}
  ports: [{port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment

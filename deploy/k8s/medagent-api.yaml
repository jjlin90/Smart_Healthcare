apiVersion: v1
kind: ConfigMap
metadata:
  name: medagent-config
data:
  APP_NAME: MedAgent AI
  REDIS_URL: redis://redis:6379/0
  SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
  SILICONFLOW_MODEL: deepseek-ai/DeepSeek-V4-Flash
  LOCAL_INTENT_BASE_URL: http://lm-studio:1234/v1
  LOCAL_INTENT_MODEL: qwen/qwen3.5-9b
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: medagent-ai
  MCP_SERVER_URL: http://medagent-mcp:8002/mcp
  MCP_HOST: 0.0.0.0
  MCP_PORT: "8002"
  SYMPTOM_AGENT_URL: http://symptom-agent:8011
  DRUG_AGENT_URL: http://drug-agent:8012
  GUIDE_AGENT_URL: http://guide-agent:8013
---
apiVersion: v1
kind: Secret
metadata:
  name: medagent-secrets
type: Opaque
stringData:
  SECRET_KEY: REPLACE_ME
  DATABASE_URL: REPLACE_ME
  SILICONFLOW_API_KEY: REPLACE_ME
  LANGSMITH_API_KEY: REPLACE_ME
  HOSPITAL_APP_KEY: REPLACE_ME
  HOSPITAL_APP_SECRET: REPLACE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medagent-api-stable
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: medagent-api, track: stable}
  template:
    metadata:
      labels: {app: medagent-api, track: stable}
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/medagent-ai:stable
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: medagent-config}
            - secretRef: {name: medagent-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medagent-api-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: medagent-api, track: canary}
  template:
    metadata:
      labels: {app: medagent-api, track: canary}
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/medagent-ai:canary
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: medagent-config}
            - secretRef: {name: medagent-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medagent-api-stable
spec:
  selector: {app: medagent-api, track: stable}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: medagent-api-canary
spec:
  selector: {app: medagent-api, track: canary}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medagent-api
spec:
  ingressClassName: nginx
  rules:
    - host: medagent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: medagent-api-stable, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medagent-api-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: medagent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: medagent-api-canary, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medagent-api-stable
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: medagent-api-stable}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}

name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      LANGSMITH_TRACING: 'false'
      DATABASE_URL: sqlite+aiosqlite:///./artifacts/ci.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install verified dependency versions
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Verify code, index, dependencies and regression tests
        run: python scripts/preflight_git.py

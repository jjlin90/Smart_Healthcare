global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: medagent-api
    metrics_path: /metrics/api
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: medagent-symptom
    metrics_path: /metrics/symptom
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: medagent-drug
    metrics_path: /metrics/drug
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: medagent-guide
    metrics_path: /metrics/guide
    static_configs:
      - targets: ["host.docker.internal:9100"]

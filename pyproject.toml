[project]
name = "medagent-ai"
version = "1.0.0"
description = "A2A multi-agent medical consultation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.53",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.22",
  "aiomysql>=0.2",
  "httpx>=0.28",
  "cachetools>=7.0",
  "python-jose[cryptography]>=3.5",
  "pydantic-settings>=2.15",
  "python-multipart>=0.0.32",
  "openai>=3.16",
  "fastmcp>=4.0",
  "python-a2a[server]>=0.5.10",
  "tenacity>=9.1",
  "langchain[mcp]>=1.4,<1.5",
  "langchain-openai>=1.6,<1.7",
  "langsmith>=0.13",
  "streamlit>=1.40",
  "locust>=2.46",
  "redis>=8.1",
  "prometheus-client>=0.26",
  "torch>=2.5",
  "transformers>=4.51",
  "sentence-transformers>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
